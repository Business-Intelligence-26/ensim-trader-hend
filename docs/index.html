<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feed sanity check</title></head>
<body>
  <h1>Feed sanity check</h1>
  <section>
    <h2>Market</h2>
    <pre id="market" aria-live="polite">Loading...</pre>
  </section>
  <section>
    <h2>Holdings</h2>
    <pre id="holdings" aria-live="polite">Loading...</pre>
  </section>
<script>
const MARKET_URL = "https://raw.githubusercontent.com/exofri/ensim-trade-center/main/docs/data/market.json";
const HOLDINGS_URL = "https://raw.githubusercontent.com/exofri/ensim-trade-center/main/traders/hendzormati/holdings.json";

async function checkFeed(id, url, describe) {
  const output = document.getElementById(id);
  try {
    const response = await fetch(url);
    if (!response.ok) {
      output.textContent = id === "holdings" && response.status === 404
        ? "Holdings feed unavailable (HTTP 404). Check your registration and the exact URL with the organizer."
        : `Feed unavailable (HTTP ${response.status}).`;
      return;
    }
    const data = await response.json();
    output.textContent = describe(data);
  } catch (error) {
    output.textContent = `Could not read the feed as JSON. ${error.message}`;
  }
}

checkFeed("market", MARKET_URL, (market) => JSON.stringify({
  generated_at: market.generated_at,
  products: market.products,
  ticks: market.history.length,
  latest_tick: market.history.at(-1),
}, null, 2));
checkFeed("holdings", HOLDINGS_URL, (holdings) => JSON.stringify(holdings, null, 2));
</script>
</body>
</html>
